data:
  input_dirs:
    - data/pdfs
  glob: '*.pdf'
  ignore_hidden: true
chunking:
  chunk_size: 500
  chunk_overlap: 50
  separators:
    - "\n\n"
    - "\n"
    - '. '
    - '.'
    - '!'
    - '?'
embedding:
  model_name: intfloat/multilingual-e5-small
  device: cpu
vector_store:
  provider: chroma
  persist_directory: chroma_db
  collection_name: rag_documents
pipeline:
  batch_size: 100
  manifest_path: artifacts/ingest_manifest.json
logging:
  level: INFO
  log_file: logs/ingest.log
pdf_processing:
  extract_text: true
  extract_tables: false
  extract_images: false
  ocr_language: "vie+eng"
  table_format: "markdown"
